name: Actualizar precios

on:
  schedule:
    # Dos veces por hora, en los minutos 23 y 53 (UTC). GitHub retrasa o descarta ejecuciones
    # programadas cuando tiene mucha carga, sobre todo al principio de cada hora; así se evita
    # esa franja y, si se pierde una, la siguiente llega 30 minutos después.
    - cron: '23,53 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Descargar precios del Ministerio
        run: node scripts/collect.mjs

      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Precios $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      # Opcional: "dead man's switch" en healthchecks.io (gratis). Si deja de recibir este aviso,
      # healthchecks.io manda un correo aunque GitHub o el Worker de Cloudflare estén parados.
      # Se activa añadiendo el secreto HEALTHCHECK_URL (Settings → Secrets and variables → Actions).
      - name: Avisar a healthchecks.io
        if: ${{ env.HEALTHCHECK_URL != '' }}
        run: curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL"
