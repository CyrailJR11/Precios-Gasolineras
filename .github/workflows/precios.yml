name: Actualizar precios

on:
  schedule:
    # Cada hora, en el minuto 7 (UTC). GitHub puede retrasarlo algunos minutos.
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Descargar precios del Ministerio
        run: node scripts/collect.mjs

      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Precios $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
